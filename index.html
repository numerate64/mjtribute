<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Michael Jackson August Tribute</title>
    <meta
      name="description"
      content="A daily August tribute to Michael Jackson, featuring one song for each day of the month."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("mjtribute-theme");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="utility-bar">
        <span>Michael Jackson August Tribute</span>
        <div class="utility-actions">
          <time class="local-time" id="localTime" aria-live="polite">Local time --:--:--</time>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true">☾</span>
          </button>
        </div>
      </div>

      <section class="feature" aria-live="polite">
        <div class="feature-copy">
          <p class="kicker" id="dateLabel">August</p>
          <h1 id="songTitle">Loading</h1>
          <p class="album" id="albumLine"></p>
          <p class="tribute" id="tributeLine"></p>
          <div class="music-links" aria-label="Music links">
            <a class="music-link music-link-youtube" id="youtubeMusicLink" href="#" target="_blank" rel="noopener noreferrer" title="YouTube Music">
              <span class="sr-only">YouTube Music video</span>
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="24" r="17.5" fill="none" stroke="currentColor" stroke-width="4" />
                <path d="M20 15.5 32 24 20 32.5Z" fill="currentColor" />
              </svg>
            </a>
            <a class="music-link music-link-spotify" id="spotifyLink" href="#" target="_blank" rel="noopener noreferrer" title="Spotify">
              <span class="sr-only">Spotify</span>
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="24" r="19" fill="currentColor" />
                <path d="M14 18.2c7.2-2 15.1-1.3 21.2 2.1" fill="none" stroke="var(--bg)" stroke-linecap="round" stroke-width="3.2" />
                <path d="M15.8 24c5.8-1.5 12.1-1 17 1.8" fill="none" stroke="var(--bg)" stroke-linecap="round" stroke-width="2.7" />
                <path d="M17.5 29.2c4.2-1 8.5-.7 12.1 1.3" fill="none" stroke="var(--bg)" stroke-linecap="round" stroke-width="2.35" />
              </svg>
            </a>
            <a class="music-link music-link-apple" id="appleMusicLink" href="#" target="_blank" rel="noopener noreferrer" title="Apple Music">
              <span class="sr-only">Apple Music</span>
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <rect x="9" y="9" width="30" height="30" rx="8" fill="currentColor" />
                <path d="M29.5 16.2v14.2c0 2.5-2.1 4.2-4.7 4.2-2.1 0-3.8-1.1-3.8-2.8 0-1.8 1.8-3.1 4.1-3.1.8 0 1.5.1 2.1.4v-8.8l-10.2 2v10.3c0 2.5-2.1 4.2-4.7 4.2-2.1 0-3.8-1.1-3.8-2.8 0-1.8 1.8-3.1 4.1-3.1.8 0 1.5.1 2.1.4V18.9l14.6-2.7Z" transform="translate(3 -2)" fill="var(--bg)" />
              </svg>
            </a>
          </div>
        </div>

        <figure class="artwork-panel">
          <img id="songArt" alt="" />
          <figcaption id="artCaption"></figcaption>
        </figure>
      </section>

      <section class="calendar-section" aria-labelledby="calendarHeading">
        <div class="calendar-header">
          <h2 id="calendarHeading">August Calendar</h2>
          <button class="today-button" id="todayButton" type="button">Today</button>
        </div>
        <div class="calendar-grid" id="calendarGrid" aria-label="Choose an August date"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
